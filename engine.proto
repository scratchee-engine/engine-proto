syntax = "proto3";

package scratchee.engine;

// ============================================================================
// Engine gRPC Service
// ============================================================================

service Engine {
  // API key issuance
  rpc IssueApiCertificate(IssueApiCertificateRequest) returns (IssueApiCertificateResponse);

  // Game lifecycle commands
  rpc CommissionGame(CommissionGameRequest) returns (CommissionGameResponse);
  rpc ActivateGame(ActivateGameRequest) returns (ActivateGameResponse);
  rpc SuspendGame(SuspendGameRequest) returns (SuspendGameResponse);
  rpc ReactivateGame(ReactivateGameRequest) returns (ReactivateGameResponse);
  rpc RetireGame(RetireGameRequest) returns (RetireGameResponse);
  rpc DeleteGame(DeleteGameRequest) returns (DeleteGameResponse);

  // Card operations
  rpc DealCards(DealCardsRequest) returns (DealCardsResponse);
  rpc RevealCard(RevealCardRequest) returns (RevealCardResponse);
  rpc CompleteCard(CompleteCardRequest) returns (CompleteCardResponse);
  rpc RedeemCard(RedeemCardRequest) returns (RedeemCardResponse);

  // Query operations
  rpc VerifyCard(VerifyCardRequest) returns (VerifyCardResponse);
  rpc GetCardState(GetCardStateRequest) returns (GetCardStateResponse);
  rpc GetRollProof(GetRollProofRequest) returns (GetRollProofResponse);
  rpc GetGameProof(GetGameProofRequest) returns (GetGameProofResponse);
  rpc ValidateGameForCommission(ValidateGameForCommissionRequest) returns (ValidateGameForCommissionResponse);
  rpc GetLicensedFeatures(GetLicensedFeaturesRequest) returns (GetLicensedFeaturesResponse);
}

// ============================================================================
// Common structures
// ============================================================================

message AuditEntry {
  string operation = 1;
  string game_id = 2;
  uint64 sequence_number = 3;
  uint64 timestamp = 4;
  string payload_hash = 5;
  string entry_hash = 6;
  string signature = 7;
  optional string previous_hash = 8;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}

// ============================================================================
// IssueApiCertificate
// ============================================================================

message IssueApiCertificateRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
  string public_key_hex = 3;  // 33-byte compressed secp256k1 public key (hex)
  string name = 4;
}

message IssueApiCertificateResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;
  optional AuditEntry audit_entry = 4;
  optional ErrorResponse error = 5;
}

// ============================================================================
// CommissionGame
// ============================================================================

message CommissionGameRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
  optional string signature = 3;

  // Commission params as JSON string (mirrors CommissionGameParams from types.rs)
  // Includes: game_id, series, game, prize_tiers, total_losers, minimum_winners_per_roll, roll_size, card_gen
  string params_json = 4;
}

message CommissionGameResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;
  optional AuditEntry audit_entry = 4;
  optional ErrorResponse error = 5;
}

// ============================================================================
// ActivateGame
// ============================================================================

message ActivateGameRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
  optional string signature = 3;
  string game_id = 4;
}

message ActivateGameResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;
  optional AuditEntry audit_entry = 4;
  optional ErrorResponse error = 5;
}

