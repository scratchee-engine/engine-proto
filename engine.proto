  uint64 timestamp = 2;
  string game_id = 3;
}

message GetCommissionStatsResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;
  optional string error = 4;
  optional bool computing = 5;  // true if stats compute in progress, API should retry
}

// RecomputeCommissionStats (SEN-1025): regenerate + re-cache a committed game's
// commission stats from its retained inputs using the current stats code, then
// persist. Stats-only — no recommission, no VRF/outcome/card change. Used to repair
// games whose cached stats were baked by older stats code (e.g. the decoy-value
// distribution fix). Synchronous (no `computing`); `data_json` is the fresh
// serialized CommissionStats, same shape as GetCommissionStatsResponse.data_json.
message RecomputeCommissionStatsRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
  string game_id = 3;
}

message RecomputeCommissionStatsResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;
  optional string error = 4;
}

// GetQuarantine (SEN-948): list all quarantined audit entries for operator visibility.
message GetQuarantineRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
}

message GetQuarantineResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;  // JSON { count, entries[] } of quarantined audit entries when ok=true
  optional string error = 4;
}

// ClearQuarantine (SEN-949): clear quarantined audit entries. Mutating operator action —
// routes through the engine's signature-gated + audited command path. API exposure of this
// RPC must be Knox-authorized (removes audit-forensic records + resets retry state).
message ClearQuarantineRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
  optional string signature = 3;
  string mode = 4;                 // "all" | "by_game_id" | "by_entry_hash"
  optional string game_id = 5;     // required for by_game_id
  optional string entry_hash = 6;  // hex, required for by_entry_hash
  bool dry_run = 7;
}

message ClearQuarantineResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;  // JSON { removed_count, dry_run }
  optional AuditEntry audit_entry = 4;
  optional ErrorResponse error = 5;
}

// ============================================================================
// GetCardRedeemAudit — SEN-1154: retrieve persisted CardRedeem audit entry (off-lock file I/O)
// ============================================================================

message GetCardRedeemAuditRequest {
  uint64 request_id = 1;
  string card_serial = 2;
}

message GetCardRedeemAuditResponse {
  bool ok = 1;
  uint64 request_id = 2;
  string card_serial = 3;
  string audit_entry_json = 4;  // JSON-serialized AuditEntryResponse
  optional ErrorResponse error = 5;
}
