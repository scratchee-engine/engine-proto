// ============================================================================
// DealCards
// ============================================================================

message DealCardsRequest {
  uint64 request_id = 1;
  uint64 timestamp = 2;
  optional string signature = 3;
  string game_id = 4;
  uint32 count = 5;
  optional string metadata = 6;
  optional string modifiers_json = 7;  // JSON map of string->string
}

message DealCardsResponse {
  bool ok = 1;
  uint64 request_id = 2;
  optional string data_json = 3;
  optional AuditEntry audit_entry = 4;
